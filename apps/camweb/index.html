<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>远程相机实时预览</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--dim:#8b949e;--ok:#3fb950;--err:#f85149;--acc:#58a6ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.6 system-ui,"Segoe UI",sans-serif}
  header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600}
  .rbtn{margin-top:8px;padding:4px 12px;font-size:12px;cursor:pointer;
  background:#238636;color:#fff;border:0;border-radius:5px}
.rbtn:hover{background:#2ea043}
.ver2{font-size:11px;color:#8b949e;margin-left:6px;font-weight:400}
.verwarn{background:#3d1418;color:#f85149;padding:8px 12px;border:1px solid #f85149;border-radius:6px;margin:8px 0;font-size:13px;line-height:1.6}
.ver{color:var(--dim);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px}
  main{padding:14px 16px;display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
  @media(max-width:1000px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
  .card h2{font-size:12px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.4px}
  label{display:block;font-size:11.5px;color:var(--dim);margin:8px 0 3px}
  input,select{width:100%;padding:6px 8px;background:#0d1117;border:1px solid var(--line);
    border-radius:4px;color:var(--text);font-size:12.5px;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--acc)}
  button{padding:7px 12px;background:#238636;border:1px solid #2ea043;border-radius:5px;
    color:#fff;font-size:12.5px;cursor:pointer;font-family:inherit}
  button:hover{background:#2ea043}
  button.sec{background:#21262d;border-color:var(--line);color:var(--text)}
  button.sec:hover{background:#30363d}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  #msg{margin-top:10px;font-size:11.5px;white-space:pre-wrap;word-break:break-all;min-height:18px}
  .ok{color:var(--ok)}.err{color:var(--err)}.dim{color:var(--dim)}

  /* ── 相机勾选 ── */
  .cams{display:flex;flex-direction:column;gap:4px;margin-top:4px}
  .cam{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:4px;cursor:pointer;
    border:1px solid transparent;font-size:12.5px}
  .cam:hover{background:#21262d}
  .cam input{width:auto;margin:0;cursor:pointer;flex:0 0 auto}
  .cam .nm{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
  .cam .tag{font-size:10px;padding:0 5px;border-radius:8px;border:1px solid var(--line);color:var(--dim)}
  .cam .tag.nodata{color:var(--err);border-color:#f85149}
  .cam .tag.live{color:var(--ok);border-color:#2ea043}
  .cam .tag.warn{color:#d29922;border-color:#9e6a03}

  /* ── 画面网格 ── */
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
  .cell{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;
    display:flex;flex-direction:column}
  .cell .hd{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);
    font-size:11.5px;flex:0 0 auto}
  .cell .hd .nm{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell .hd button{padding:1px 6px;font-size:11px;background:#21262d;border:1px solid var(--line);
    color:var(--text);border-radius:3px}
  .cell .hd button:hover{background:#30363d}
  .cell .hd .rot{min-width:38px;text-align:center;color:var(--acc);font-variant-numeric:tabular-nums}
  .cell .hd .rot.on{color:#e3b341}
  .view{background:#000;height:250px;display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative}
  .view img,.view canvas{display:block;max-width:100%;max-height:100%}
  .view canvas{transition:transform .15s}
  /* 拉 MJPEG 流的源 <img>：藏起来但仍要参与解码。
     用 1x1+透明而不是 display:none —— 后者会让部分浏览器不再解码后续帧，
     画面就会永远停在第一帧。 */
  .view img.src{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
  .view .ph{color:#484f58;font-size:12px;text-align:center;padding:0 12px;line-height:1.7}
  .cell .ft{display:flex;gap:8px;align-items:center;padding:4px 8px;border-top:1px solid var(--line);
    font-size:10.5px;color:var(--dim);flex-wrap:wrap;min-height:24px}
  .cell .ft .e{color:var(--err)}

  .bar{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);
    border-radius:6px;font-size:11.5px;color:var(--dim);flex-wrap:wrap;margin-top:10px;background:var(--panel)}
  .dot{width:7px;height:7px;border-radius:50%;background:#484f58;display:inline-block;flex:0 0 auto}
  .dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .lagbox{font-variant-numeric:tabular-nums;padding:1px 7px;border-radius:10px;
    border:1px solid var(--line);font-size:11px}
  .lagbox.good{color:var(--ok);border-color:#2ea043;background:#0d2818}
  .lagbox.mid{color:#e3b341;border-color:#9e6a03;background:#2d1f00}
  .lagbox.bad{color:var(--err);border-color:#f85149;background:#2d0f0f}
  .warn{background:#2d1f00;border:1px solid #9e6a03;border-radius:5px;padding:8px 10px;
    font-size:11.5px;color:#e3b341;margin-top:10px}

  /* 连接/断开：两个状态必须一眼分清，否则容易点错。
     连接后断开按钮变主视觉（红色描边 + 脉冲），并直接显示路数。 */
  #go{font-size:14px;font-weight:600;padding:9px 12px}
  #stop{font-size:14px;font-weight:600;padding:9px 12px}
  #stop.armed{background:#8b1a1a;border-color:#f85149;color:#fff;
    box-shadow:0 0 0 1px #f85149, 0 0 10px rgba(248,81,73,.45);
    animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 1px #f85149,0 0 10px rgba(248,81,73,.45)}
    50%{box-shadow:0 0 0 1px #f85149,0 0 16px rgba(248,81,73,.8)}}
  #go.busy{background:#1f6feb;border-color:#388bfd}

  /* 日志面板：替代黑窗口，服务端输出实时显示在这里 */
  #logpane{background:#010409;border:1px solid var(--line);border-radius:6px;
    margin-top:10px;overflow:hidden}
  #logpane .lh{display:flex;align-items:center;gap:8px;padding:5px 10px;
    border-bottom:1px solid var(--line);font-size:11.5px;color:var(--dim)}
  #logpane .lh button{padding:1px 7px;font-size:11px;background:#21262d;
    border:1px solid var(--line);color:var(--text);border-radius:3px}
  #logbody{height:190px;overflow-y:auto;padding:6px 10px;font-size:11px;
    font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.55;white-space:pre-wrap;
    word-break:break-all;color:#8b949e}
  #logbody .e{color:#f85149}
  #logbody .c{color:#58a6ff}
  .logwrap{display:block}
  .empty{color:#484f58;font-size:13px;padding:60px 0;text-align:center;
    border:1px dashed var(--line);border-radius:6px}
</style>
</head>
<body>
<div id="gatelock" style="position:fixed;inset:0;z-index:99;
  background:rgba(6,13,11,.94);display:none;align-items:center;justify-content:center">
  <div style="width:330px;background:#0d1613;border:1px solid #1e332b;
    border-radius:10px;padding:22px">
    <div style="font-size:16px;font-weight:600;margin-bottom:4px">需要登录</div>
    <div style="font-size:12px;color:#7d8b85;margin-bottom:14px">
      远程相机受账号保护，请输入分配给你的账号密码。</div>
    <label style="font-size:12px;color:#9fb0a9">账号</label>
    <input id="gu" autocomplete="off" style="width:100%;margin:4px 0 10px">
    <label style="font-size:12px;color:#9fb0a9">密码</label>
    <input id="gp" type="password" style="width:100%;margin:4px 0 10px">
    <div id="gerr" style="color:#ff6b6b;font-size:12px;min-height:16px"></div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button id="gok" style="flex:1">登录</button>
    </div>
  </div>
</div>
<header>
  <h1>远程相机实时预览</h1><span class="ver">v2.10</span><span id="svver" class="ver2"></span>
  <span class="dim" style="margin-left:auto;font-size:11.5px" id="caps"></span>
</header>

<main>
  <div class="card">
    <h2>连接</h2>
    <div class="row">
      <div><label>主机</label><input id="host" value="frp.aotbot.com"></div>
      <div style="max-width:96px"><label>端口</label><input id="port" value="21934" type="number"></div>
    </div>
    <div class="row">
      <div><label>用户名</label><input id="user" value="aoting"></div>
      <div><label>密码</label><input id="pwd" type="password" placeholder="SSH 密码"></div>
    </div>

    <label style="margin-top:12px">相机（勾选即显示，没数据的自动隐藏）</label>
    <div class="cams" id="cams"></div>

    <div class="row" style="margin-top:10px">
      <div><label>消息类型</label>
        <select id="mtype">
          <option value="sensor_msgs/Image">sensor_msgs/Image（raw）</option>
          <option value="sensor_msgs/CompressedImage">CompressedImage（jpeg/png）</option>
        </select></div>
    </div>
    <div class="row">
      <div><label>最大宽度</label>
        <select id="width"><option>320</option><option selected>640</option>
        <option>960</option><option>1280</option><option>0</option></select></div>
      <div><label>帧率上限</label>
        <select id="fps"><option>5</option><option selected>10</option>
        <option>15</option><option>25</option></select></div>
    </div>
    <div class="row">
      <div><label>JPEG 质量</label>
        <select id="quality"><option>35</option><option>45</option><option selected>55</option>
        <option>70</option><option>85</option><option value="0">0 = 不编码</option></select></div>
      <div><label>追帧阈值（秒）</label>
        <select id="maxlag"><option>0.3</option><option selected>1.0</option>
        <option>3</option><option value="999">不丢帧</option></select></div>
    </div>
    <div style="margin-top:12px;display:flex;flex-direction:column;gap:7px">
      <button id="go">▶ 连接</button>
      <button class="sec" id="stop" disabled>⏹ 断开</button>
    </div>
    <div id="msg"></div>
    <div class="warn">画面经你这台电脑中转，<b>不会外传</b>。SSH 密码只在本机内存，不写磁盘。</div>
  </div>

  <div>
    <div id="grid"></div>
    <div class="empty" id="empty">勾选相机 → 点「连接」</div>
    <div class="bar">
      <span class="dot" id="dot"></span><span id="st">未连接</span>
      <span id="cnt" style="margin-left:auto"></span>
    </div>
    <div id="logpane">
      <div class="lh"><b>日志</b><span style="opacity:.7">服务端输出，等同黑窗口内容</span>
        <span style="margin-left:auto"><button id="logclr">清空</button></span></div>
      <div id="logbody"></div>
    </div>
  </div>
</main>

<script>
const $ = i => document.getElementById(i);
// 固定五路。装歪的相机靠每格右上角的旋转按钮单独纠正，角度会记在本地。
const CAMS = [1,2,3,4,5].map(n => ({key:'cam'+n, name:'camera_0'+n,
              label:'camera_0'+n, topic:'/camera_0'+n+'/color/image_raw'}));
// 默认只勾 1、2。
// 原因：多数车只有 1、2 两路；勾了不存在的相机，虽然会超时后自动
// 放手，但每次连接都要多等一轮、也多占一个 SSH 连接和车上一个进程。
// 想看其他路在左栏勾上即可（勾选状态不保存，每次开都是 1、2）。
const DEFAULT_ON = ['cam1', 'cam2'];
const ROTS = [0, 90, 180, 270];
const ROTKEY = 'camweb.rot.v1';

const sessions = new Map();   // key -> {sid, rot, el, nodata, t0, err}
let lastCfg = null;           // 最近一次的连接参数，断线重连用
const MAX_RETRY = 3;          // 自动重连次数上限，避免死循环
let rots = {};
try { rots = JSON.parse(localStorage.getItem(ROTKEY) || '{}'); } catch(e){ rots = {}; }
let timer = null;
let curHostText = '';      // 当前连的是哪台车，状态栏用

/* ── 门禁 ──
   页面上的登录框只是提示：真正的校验在服务端（/api/connect 等接口
   会返回 401）。直接打开 8765 的人同样会被拦在这里。 */
function showLogin(msg){
  const el = $('gatelock');
  el.style.display = 'flex';
  if (msg) $('gerr').textContent = msg;
  const u = $('gu'); if (u) u.focus();
}
function hideLogin(){ const el=$('gatelock'); if(el) el.style.display='none'; }

async function gateLogin(){
  const u = $('gu').value.trim(), p = $('gp').value;
  $('gerr').textContent = '';
  if (!u || !p) { $('gerr').textContent = '请填账号和密码'; return; }
  try {
    const r = await (await fetch('/api/gate_login', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user:u, pwd:p})})).json();
    if (r && r.ok) { hideLogin(); location.reload(); return; }
    $('gerr').textContent = (r && r.err) || '登录失败';
  } catch(e){ $('gerr').textContent = String((e && e.message) || e); }
}

async function checkGate(){
  try {
    const r = await (await fetch('/api/gate_state', {cache:'no-store'})).json();
    // 兜底：页面加载太早、或会话是后来才建立的，这里补一次。
    // 下一帧渲染就会用上新账号（renderTick 每帧都读 wmUser()）。
    if (r && r.user) WM_USER = String(r.user).trim();
    if (r && r.need) showLogin('');
  } catch(e){}
}

async function jpost(p, b, timeoutMs) {
  // 带超时。原来没有它，请求会一直挂着 —— 车上残留进程把 CPU 吃满时
  // 连接请求可能几十秒不返回，界面就永远停在"连接中"而没有任何解释。
  const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  let tm = null;
  if (ac && timeoutMs) tm = setTimeout(() => ac.abort(), timeoutMs);
  try {
    const r = await fetch(p, {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(b),
      signal: ac ? ac.signal : undefined});
    const j = await r.json();
    // 服务端判定未登录（会话过期/直接开的页面）：弹登录而不是报业务错
    if (j && j.needLogin) showLogin('登录状态已失效，请重新登录');
    return j;
  } catch(e){
    if (e && e.name === 'AbortError')
      return {ok:false, err:'超时（' + Math.round(timeoutMs/1000) + 's 无响应）'};
    return {ok:false, err:String((e && e.message) || e)};
  } finally { if (tm) clearTimeout(tm); }
}
function say(t, cls){ const e=$('msg'); e.textContent=t; e.className=cls||''; }
function saveRots(){ try{ localStorage.setItem(ROTKEY, JSON.stringify(rots)); }catch(e){} }

/* ── 左栏：相机勾选 ── */
function buildCamList(){
  const box = $('cams');
  box.innerHTML = '';
  CAMS.forEach(c => {
    const d = document.createElement('label');
    d.className = 'cam';
    const on = DEFAULT_ON.indexOf(c.key) >= 0;
    d.innerHTML = '<input type="checkbox" data-k="'+c.key+'"'
      + (on ? ' checked' : '') + '>'
      + '<span class="nm">'+c.topic+'</span>'
      + '<span class="tag" data-tag="'+c.key+'"></span>';
    box.appendChild(d);
  });
}
function checked(){
  return CAMS.filter(c => $('cams').querySelector('input[data-k="'+c.key+'"]').checked);
}
function setTag(key, txt, cls){
  const e = $('cams').querySelector('[data-tag="'+key+'"]');
  if (e) { e.textContent = txt; e.className = 'tag' + (cls ? ' ' + cls : ''); }
}

/* ── 旋转：90/270 时宽高互换，所以要按容器实测尺寸算 max-width/height ── */
function fit(img, rot){
  const box = img.parentElement;
  const cw = box.clientWidth, ch = box.clientHeight;
  if (!cw || !ch) return;
  if (rot === 90 || rot === 270) { img.style.maxWidth = ch + 'px'; img.style.maxHeight = cw + 'px'; }
  else { img.style.maxWidth = cw + 'px'; img.style.maxHeight = ch + 'px'; }
}

function makeCell(c){
  const s = sessions.get(c.key);
  const el = document.createElement('div');
  el.className = 'cell';
  el.innerHTML =
    '<div class="hd">'
    + '<span class="nm">'+c.name+'</span>'
    + '<button data-act="rot" title="旋转 90°（装歪的相机用这个纠正）">⟳</button>'
    + '<span class="rot" data-rot>0°</span>'
    + '</div>'
    + '<div class="view"><span class="ph">连接中…</span></div>'
    + '<div class="ft"><span data-ft></span></div>';
  s.el = el;
  s.rotEl = el.querySelector('[data-rot]');
  s.view = el.querySelector('.view');
  s.ft = el.querySelector('[data-ft]');
  s.rot = rots[c.key] || 0;

  el.querySelector('[data-act="rot"]').onclick = () => {
    const i = ROTS.indexOf(s.rot);
    s.rot = ROTS[(i + 1) % ROTS.length];
    rots[c.key] = s.rot;
    saveRots();
    applyRot(c);
  };
  return el;
}
function applyRot(c){
  const s = sessions.get(c.key); if (!s) return;
  s.rotEl.textContent = s.rot + '°';
  s.rotEl.className = 'rot' + (s.rot ? ' on' : '');
  // 旋转在画 canvas 时做掉（这样「另存为」拿到的是正过来的图），
  // 所以这里只要让它下一帧重画即可，不用再摆 CSS transform。
  if (s.cv && !s.cvFail){ s.lastDraw = 0; startRender(); return; }
  const img = s.view.querySelector('img');
  if (img) { img.style.transform = s.rot ? 'rotate(' + s.rot + 'deg)' : ''; fit(img, s.rot); }
}

function mount(c){
  const s = sessions.get(c.key);
  // 复用已有格子。
  //
  // 原来每次都新建一个 div 再 append，于是一路相机重试一次就多一个
  // 格子（或者旧格子还留着，看起来像"开了个新窗口"）。
  // 现在已有就不重建，只重置内容 —— 位置也保持不变。
  if (s.el && s.el.parentNode) {
    abortImg(s.view.querySelector('img'));
    s.view.innerHTML = '';
    s.ft.innerHTML = '';
    applyRot(c);
    if (s.sid) attach(c);
    return;
  }
  const el = makeCell(c);
  $('grid').appendChild(el);
  applyRot(c);
  // 拿到 sid 后才挂 img（src 要带 sid）
  if (s.sid) attach(c);
}
/* 主动掐断一个 MJPEG 流。
   直接 removeChild 只是删 DOM，浏览器那条连接不会立刻释放 ——
   而 Chrome 对同一个 host:port 的并发连接上限是 6（HTTP/1.1）。
   反复重连会攒下一堆"僵尸流"，把名额占满后新流就排不上队，
   表现正是：服务端日志刷着"已发 N 帧"，画面却全黑。 */
function abortImg(img){
  if (!img) return;
  try {
    img.onload = img.onerror = null;
    img.src = 'about:blank';
  } catch(e){}
}

/* ───────── 画面水印 ─────────
   为什么要烧进 canvas，而不是在画面上盖一层 div：
     盖 div 的话，右键「图片另存为」存下来的是干净原图，水印等于白加。
     烧进 canvas 之后，另存 / 截图 / 手机翻拍拿到的都是带水印的那一份。
   内容 = 登录账号 + 目标机器 + 本机时间：万一外传，能追到人和时间。 */
/* 初值来自服务端注入（server.py 的 _html 把账号写进 window.__WM_USER__）。
   这是唯一可靠来源 —— 之前只靠前端异步取，而赋值语句根本没写，
   结果所有人的水印都显示"未登录"。 */
let WM_USER = ((typeof window !== 'undefined' && window.__WM_USER__) || '').trim();

function wmUser(){ return (WM_USER || '').trim() || '未登录'; }
function wmTarget(){
  try { return (($('host').value || '').trim() + ':' + ($('port').value || '').trim()); }
  catch(e){ return ''; }
}
function wmTime(){
  const d = new Date(), p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate())
       + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

/* 把水印画到已经铺好图像的 canvas 上。
   单独拎成函数是为了能测：传一个假 ctx 进去就能断言到底画了什么。 */
function drawWatermark(ctx, w, h, opt){
  const o = opt || {};
  const user = o.user || '未登录';
  let line = [user, o.target || '', o.time || ''].filter(Boolean).join(' · ');
  ctx.save();
  try {
    // ① 满屏斜纹：只盖一个角的话，裁一下就没了
    if (o.tile !== false && w > 40 && h > 40){
      const fs = Math.max(11, Math.round(Math.min(w, h) / 20));
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = '#ffffff';
      ctx.font = fs + 'px "Segoe UI","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      const txt = user + (o.time ? '  ' + o.time : '');
      const span = Math.ceil(Math.sqrt(w * w + h * h));
      /* 平铺间距必须按【文字实际宽度】算，不能按画布比例。
         之前 sx 写的是 w/3，而"账号+时间"这条文字往往比 w/3 更宽，
         于是上下左右相邻的两条会叠在一起 —— 表现就是时分秒压住账号名。
         现在用 measureText 量出真实宽度再留间隔。 */
      const twm = (ctx.measureText ? ctx.measureText(txt).width
                                   : txt.length * fs * 0.6);
      const sx = Math.max(120, Math.round(twm + Math.max(48, fs * 2)));
      const sy = Math.max(Math.round(fs * 5), Math.round(h / 4));
      ctx.translate(w / 2, h / 2);
      ctx.rotate(-Math.PI / 9);
      for (let y = -span; y <= span; y += sy)
        for (let x = -span; x <= span; x += sx)
          ctx.fillText(txt, x, y);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
    // ② 右下角实心标签：截图被压扁、缩成缩略图后仍能一眼看清是谁
    const fs2 = Math.max(11, Math.round(Math.min(w, h) / 22));
    ctx.font = fs2 + 'px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    const pad = Math.max(4, Math.round(fs2 / 2));
    const mt = t => (ctx.measureText ? ctx.measureText(t).width : t.length * fs2 * 0.6);
    // 窄画面上「账号 · 目标 · 时间」太长会顶出左边界被裁掉，逐级裁剪：
    // 先丢目标，再丢时间，账号无论如何要留住 —— 它是追溯的唯一依据。
    const maxW = w - pad * 4;
    if (mt(line) > maxW) line = [user, o.time || ''].filter(Boolean).join(' · ');
    if (mt(line) > maxW) line = user;
    const tw = mt(line);
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#000000';
    ctx.fillRect(w - tw - pad * 2, h - fs2 - pad * 2, tw + pad * 2, fs2 + pad * 2);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#7ee787';
    ctx.fillText(line, w - pad, h - pad);
  } finally {
    ctx.restore();
  }
}

/* 拉流的仍然是 <img>（MJPEG 让浏览器原生解码，自己 fetch 解析
   multipart 又慢又容易错），但藏起来，展示改用 canvas：
   canvas 上才能把水印烧进去。 */
let _rafId = 0;
function startRender(){ if (!_rafId) _rafId = requestAnimationFrame(renderTick); }
function renderTick(){
  _rafId = 0;
  let live = false;
  sessions.forEach(s => {
    if (!s || !s.cv || s.cvFail) return;
    // 画面已被移除（断开、报错、判定无数据时 view 会被清空）：
    // 再画就是往游离节点上画，而且 rAF 会一直空转下去。
    const cv = s.cv;
    if (cv.isConnected === false || (!('isConnected' in cv) && !cv.parentNode)) return;
    live = true;
    const now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    // 上限约 12fps：源流本身才 10fps，画得再快也是同一帧，白烧 CPU
    if (now - (s.lastDraw || 0) < 80) return;
    s.lastDraw = now;
    try { paintFrame(s); } catch(e){ fallbackPlainImg(s, e); }
  });
  if (live) startRender();
}

function paintFrame(s){
  const img = s.img, cv = s.cv;
  const w0 = img.naturalWidth, h0 = img.naturalHeight;
  if (!w0 || !h0) return;
  const rot = s.rot || 0;
  const swap = (rot === 90 || rot === 270);
  const W = swap ? h0 : w0, H = swap ? w0 : h0;
  if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d');
  if (!ctx){ fallbackPlainImg(s, 'no 2d ctx'); return; }
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  if (rot) ctx.rotate(rot * Math.PI / 180);
  ctx.drawImage(img, -w0 / 2, -h0 / 2, w0, h0);
  ctx.restore();
  drawWatermark(ctx, W, H, {user: wmUser(), target: s.wmT || wmTarget(), time: wmTime()});
}

/* 万一 canvas 这条路走不通（老浏览器、显卡加速异常等），回退成原来的
   <img> 直显 —— 宁可没水印，也不能连画面都没有。 */
function fallbackPlainImg(s, e){
  if (!s || s.cvFail) return;
  s.cvFail = true;
  try {
    if (s.cv && s.cv.parentNode) s.cv.parentNode.removeChild(s.cv);
    if (s.img){
      s.img.className = '';
      s.img.style.transform = s.rot ? 'rotate(' + s.rot + 'deg)' : '';
      fit(s.img, s.rot);
    }
    uiLog('水印渲染失败，已回退为原图显示：' + ((e && e.message) ? e.message : e));
  } catch(_){}
}

function attach(c){
  const s = sessions.get(c.key); if (!s || !s.sid) return;
  // 先掐断旧流，再清 DOM —— 顺序不能反，否则连接溜掉
  const oldImg = s.view.querySelector('img');
  if (oldImg) abortImg(oldImg);
  s.view.innerHTML = '';

  const img = document.createElement('img');
  img.className = 'src';
  s.imgOk = false; s.imgAt = Date.now(); s.retryN = 0;
  img.onload = () => { s.imgOk = true; s.nodata = false; };
  img.onerror = () => { s.imgOk = false; };
  // 加时间戳防缓存：否则重连时可能命中上一次的响应
  img.src = '/stream?sid=' + s.sid + '&t=' + Date.now();

  const cv = document.createElement('canvas');
  s.view.appendChild(cv);
  s.view.appendChild(img);
  s.cv = cv; s.img = img; s.cvFail = false; s.lastDraw = 0;
  if (!s.wmT) s.wmT = wmTarget();
  startRender();
}

/* 看门狗：服务端分明在出帧，画面却一直黑。
   这种情况只能靠"重挂一次流"救回来 —— 不管是僵尸连接占满了名额，
   还是某一条流自己卡住了，重挂都比让用户干等强。
   带退避，最多重试 4 次，之后停在"流未加载"不再折腾。 */
function watchdog(){
  sessions.forEach((s, key) => {
    if (!s.sid || s.imgOk) return;
    const waited = (Date.now() - (s.imgAt || 0)) / 1000;
    if (waited < 6) return;
    if ((s.retryN || 0) >= 4) return;
    // 服务端确实在出帧才重挂（否则是无数据，交给无数据逻辑处理）
    if (!(s.stat && s.stat.n > 0)) return;
    s.retryN = (s.retryN || 0) + 1;
    s.imgAt = Date.now();
    console.warn('[wd] 画面 ' + waited.toFixed(0) + 's 未加载但有帧，'
                 + '重挂流 #' + s.retryN + ' (' + key + ')');
    attach({key});
  });
}
setInterval(watchdog, 2000);

/* ── 连接 ── */
$('go').onclick = async () => {
  const list = checked();
  if (!list.length) return say('至少勾选一个相机', 'err');
  // 换车场景：不重启工具，改 host/端口后直接再连。
  // 必须先把上一台车的会话清干净，否则旧连接还在后台跑，
  // 会和新车抢带宽，且状态栏显示的还是旧车。
  await stopAll(false);
  const cur = $('user').value + '@' + $('host').value + ':' + $('port').value;
  curHostText = cur;
  $('go').disabled = true; $('go').classList.add('busy'); $('go').textContent = '连接中…';
  say('正在 SSH 连车 ' + cur + ' …');

  const cfg = {
    host:$('host').value, port:$('port').value, user:$('user').value, pwd:$('pwd').value,
    mtype:$('mtype').value, width:$('width').value, fps:$('fps').value,
    quality:$('quality').value, max_lag:$('maxlag').value, nowait:true
  };
  lastCfg = cfg;   // 断线自动重连用
  // 超过 25 秒还没结果，先给一句人话，别让人干等着不知道出了什么事
  const slow = setTimeout(() => {
    say('仍在连接…若长时间没反应，车上可能堆积了旧的取图进程。<br>'
      + '可先在车上执行 <code>pkill -9 -f cam_agent</code> 再重试。', 'err');
  }, 25000);

  // 每路独立建连，不用 Promise.all 等全部返回。
  //
  // 为什么改掉：多路并行时，只要有一路卡住（SSH 握手慢、车 CPU 被占、
  // 该话题根本不存在导致脚本一直等），Promise.all 就会让整个界面停在
  // "连接中"，那些本来正常的路也跟着出不来图。
  // 现在每路自己建连、自己更新自己那一格 —— 谁先好谁先出图。
  uiLog('点击连接 -> ' + cur + '，勾选 ' + list.length + ' 路: '
        + list.map(c => c.label).join(', '));
  list.forEach(c => connectOne(c, cfg));

  clearTimeout(slow);
  $('go').disabled = false; $('go').classList.remove('busy');
  $('go').textContent = '⟳ 重连';
  $('stop').disabled = false;
  $('stop').classList.add('armed');
  $('stop').textContent = '⏹ 断开 (' + list.length + ')';
  say('已连上车 ' + cur + '，等待出图…', 'ok');
  $('dot').classList.add('on'); $('st').textContent = '连接中 · ' + cur;
  clearInterval(timer);
  timer = setInterval(poll, 1000);
  poll();
};

// 单独建一路。可重复调用（首次连接 / 人工重试都走这里）。
async function connectOne(c, cfg){
  const s = sessions.get(c.key) || {};
  s.rot = rots[c.key] || 0;
  s.t0 = Date.now();        // 无数据计时的起点
  s.retry = 0;
  s.err = null;
  s.sid = null;
  s.timedOut = false;
  s.expired = false;        // 上次因到时限被断开，重连要清掉
  s.remain = null;
  s.everLive = false;       // 是否曾经出过图
  sessions.set(c.key, s);
  mount(c);
  abortImg(s.view.querySelector('img'));
    s.view.innerHTML = '<span class="ph">连接中…</span>';
  s.ft.textContent = '';
  setTag(c.key, '连接中', '');

  const r = await jpost('/api/connect', Object.assign({topic:c.topic}, cfg), 45000);
  if (!sessions.has(c.key)) return;          // 期间被断开了，别再往下写
  uiLog('建连返回 ' + c.label + ': ' + (r.ok ? 'ok' : ('失败 ' + (r.err||''))));
  if (!r.ok) {
    s.err = r.err;
    abortImg(s.view.querySelector('img'));
    s.view.innerHTML = '<span class="ph">连接失败<br><span style="color:#f85149">'
      + (r.err||'') + '</span><br><button class="rbtn" data-k="' + c.key
      + '">↻ 重试</button></span>';
    bindRetry(s, c);
    setTag(c.key, '失败', 'nodata');
    return;
  }
  s.sid = r.sid;
  s.t0 = Date.now();
  abortImg(s.view.querySelector('img'));
    s.view.innerHTML = '';
  setTag(c.key, '等待数据', '');
}

function bindRetry(s, c){
  const b = s.view.querySelector('.rbtn');
  if (b) b.onclick = () => manualRetry(c);
}

// 人工重试某一路。只在用户点按钮时触发 —— 不再无脑自动重连
// （话题本来就没数据时，自动重连只是白白堆进程、拖慢整台车）。
async function manualRetry(c){
  if (!lastCfg) return;
  say('重试 ' + c.label + ' …');
  await connectOne(c, lastCfg);
}

const NO_DATA_TIMEOUT = 30000; // 30 秒仍无帧 -> 判定该相机没数据，主动放手

// 判定无数据后：断开这一路 + 显示提示 + 给一个人工重试按钮。
//
// 两件事同时做掉：
//  ① 不再无脑自动重连。话题本来就没数据时，重连只会一次次在车上
//     起 python 又杀不掉，越积越多，最终把车 CPU 吃满 —— 这正是
//     "点断开后车端还在跑""再连就一直连接中"的根源。
//  ② 主动 disconnect，把车上那个干等的脚本收掉，不白占资源。
async function markNoData(c, s){
  if (s.timedOut) return;
  s.timedOut = true;
  if (s.sid) {
    Promise.race([
      jpost('/api/disconnect', {sid:s.sid}),
      new Promise(r => setTimeout(r, 2000))
    ]).catch(() => {});
    s.sid = null;
  }
  abortImg(s.view.querySelector('img'));
    s.view.innerHTML = '<span class="ph">该相机 ' + (NO_DATA_TIMEOUT/1000)
    + 's 内无数据<br><span style="font-size:12px;opacity:.75">'
    + '话题可能不存在或未在发布</span><br>'
    + '<button class="rbtn" data-k="' + c.key + '">↻ 重试</button></span>';
  bindRetry(s, c);
  s.ft.innerHTML = '<span class="e">获取超时，无数据</span>';
  setTag(c.key, '无数据', 'nodata');
}
let stopping = false;          // 用户主动断开时，别触发自动重连

async function retryOne(c){
  if (!lastCfg || stopping) return;
  const s = sessions.get(c.key);
  if (!s || !s.sid) return;
  try { await jpost('/api/disconnect', {sid:s.sid}); } catch(e){}
  const r = await jpost('/api/connect', Object.assign({topic:c.topic}, lastCfg));
  if (stopping) return;
  if (!r.ok) {
    s.ft.innerHTML = '<span class="e">重连失败: ' + (r.err||'') + '</span>';
    return;
  }
  s.sid = r.sid; s.t0 = Date.now(); s.err = null; abortImg(s.view.querySelector('img'));
    s.view.innerHTML = '';
  setTag(c.key, '', '');
  attach(c);
}

async function poll(){
  const act = CAMS.filter(c => sessions.has(c.key));
  if (!act.length) return;
  const rs = await Promise.all(act.map(async c => {
    const s = sessions.get(c.key);
    if (!s.sid) return [c, null];
    const st = await jpost('/api/status', {sid:s.sid});
    if (st && st.ok) s.stat = st;
    return [c, st];
  }));
  let live = 0, totRate = 0, anyOffset = 0, worst = 0, enc = '';
  let worstStall = 0, nStall = 0, nDead = 0;
  rs.forEach(([c, st]) => {
    const s = sessions.get(c.key);
    if (!st || !st.ok) { if (st) s.err = st.err; return; }
    s.err = st.err;

    // 单次取图到点：服务端已自动断开，这里只负责把话说清楚并给重连入口。
    // 刻意不做自动重连 —— 用户要的就是"到点停、想看再点"，
    // 自动接上等于没限制，又会变成忘关的流一直挂着。
    s.remain = (st.remain === null || st.remain === undefined) ? null : st.remain;
    if (st.expired || (st.running === false && s.remain !== null && s.remain <= 0)) {
      s.expired = true;
      setTag(c.key, '已到时限', 'nodata');
      abortImg(s.view.querySelector('img'));
      s.view.innerHTML = '<span class="ph">本次取图已达时限<br>'
        + '<span style="color:#8b949e;font-size:12px">单次最多 '
        + Math.round((st.limit || 600) / 60) + ' 分钟，已自动断开</span>'
        + '<br><button class="rbtn" data-k="' + c.key + '">↻ 继续查看</button></span>';
      bindRetry(s, c);
      return;
    }

    // 车上脚本意外退出（不是用户点的断开）→ 自动重连。
    // 常见于 frp 抖动、车上 roscore 重启。最多重试 3 次，避免死循环。
    if (st.running === false && !stopping) {
      // 从来没出过图的路不自动重连 —— 它多半是话题根本不存在，
      // 重连只是徒增车上进程。交给用户点"重试"按钮决定。
      if (!s.everLive) { markNoData(c, s); return; }
      s.retry = (s.retry || 0) + 1;
      if (s.retry <= MAX_RETRY) {
        s.ft.innerHTML = '<span class="e">中断，正在重连(' + s.retry + '/' + MAX_RETRY + ')…</span>';
        setTag(c.key, '重连中', 'nodata');
        setTimeout(() => { if (sessions.has(c.key)) retryOne(c); }, 1500 * s.retry);
        return;
      }
      s.ft.innerHTML = '<span class="e">已中断（重连 ' + MAX_RETRY + ' 次仍失败）</span>';
      return;
    }
    if (st.err) {
      s.ft.innerHTML = '<span class="e">' + st.err + '</span>';
      setTag(c.key, '错误', 'nodata');
      return;
    }
    if (st.frames > 0) {
      s.nodata = false;
      s.everLive = true;      // 出过图 -> 之后中断才值得自动重连
      live++;
      setTag(c.key, '出图中', 'live');
      // 剩余时间提示：只在快到点时显示，平时不打扰
      if (s.remain !== null) {
        const mm = Math.floor(s.remain / 60), ss = Math.floor(s.remain % 60);
        if (s.remain <= 60) {
          setTag(c.key, '出图中 · 剩余 ' + ss + 's', 'warn');
        } else if (s.remain <= 180) {
          setTag(c.key, '出图中 · 剩余 ' + mm + ':' + String(ss).padStart(2,'0'), 'warn');
        }
      }
      const rate = st.rate ? (st.rate/1024/1024) : 0;
      totRate += rate;
      if (st.rate) enc = enc || (st.enc || '');
      s.sys = st.sys || null;
      if (st.offset_unknown) anyOffset = null;
      else if (anyOffset !== null) { anyOffset = st.offset; worst = Math.max(worst, st.lag); }

      // 停顿 / 无响应 要单独说清楚，不能只报一个"延迟"数字：
      //   stall 大但心跳新  -> 话题本身没数据（车端正常，是源头没发）
      //   心跳也断了        -> 脚本或链路挂了
      // 这两者排查方向完全不同，混成一个数字会误导。
      const stall = (st.stall === null || st.stall === undefined) ? null : st.stall;
      const hb = (st.hb === null || st.hb === undefined) ? null : st.hb;
      let ft = '';
      let dead = false, stalled = false;
      if (hb !== null && hb > 15) {
        dead = true; nDead++;
        ft = '<span class="e">脚本无响应 ' + hb.toFixed(0) + 's</span>';
      } else if (stall !== null && stall > 3) {
        stalled = true; nStall++;
        worstStall = Math.max(worstStall, stall);
        ft = '<span class="e">数据中断 ' + stall.toFixed(0) + 's</span>';
        if (hb !== null) ft += ' <span style="opacity:.7">(脚本在, 话题没数据)</span>';
      } else {
        ft = '延迟 ' + st.lag.toFixed(2) + 's';
      }
      s.ft.innerHTML = ft
        + (rate ? ' · ' + rate.toFixed(2) + ' MB/s' : '')
        + ' · 帧 ' + st.frames
        + (st.enc ? ' · ' + st.enc : '');
      if (dead || stalled) setTag(c.key, dead ? '无响应' : '没数据', 'nodata');
      if (!s.view.querySelector('img')) attach(c);
    } else if (Date.now() - s.t0 > NO_DATA_TIMEOUT) {
      markNoData(c, s);
    } else {
      const left = Math.ceil((NO_DATA_TIMEOUT - (Date.now() - s.t0)) / 1000);
      s.ft.textContent = '等待数据… ' + left + 's 后判定无数据';
    }
  });
  const nLive = live;
  const nNoData = act.filter(c => (sessions.get(c.key) || {}).timedOut).length;
  // 车端 CPU/内存：同一台车所有会话共享同一个采样值，取任意一个即可
  let sysInfo = null;
  for (const s2 of sessions.values()) { if (s2 && s2.sys) { sysInfo = s2.sys; break; } }
  if (nLive) {
    $('st').textContent = '已连接 · ' + (curHostText || '');
    let t = nLive + ' 路出图';
    if (totRate) t += ' · 合计 ' + totRate.toFixed(2) + ' MB/s';
    if (nStall || nDead) {
      const parts = [];
      if (nStall) parts.push(nStall + ' 路数据中断(最长 ' + worstStall.toFixed(0) + 's)');
      if (nDead) parts.push(nDead + ' 路脚本无响应');
      t += ' · <span style="color:#f85149">' + parts.join(' / ') + '</span>';
    } else {
      t += ' · 最大延迟 ' + worst.toFixed(2) + 's';
    }
    if (anyOffset === null) t += ' · 车钟未校准';
    else if (Math.abs(anyOffset) > 1) t += ' · 车钟偏差 ' + anyOffset.toFixed(1) + 's';
    if (nNoData) t += ' · <span style="color:#f85149">' + nNoData + ' 路无数据</span>';
    if (enc) t += ' · 车端:' + enc;
    if (sysInfo) {
      // 车端负载。CPU 高说明车自己扛不住（编码/取图），
      // 这时降带宽比查网络更有用 —— 所以颜色阈值给得宽一点。
      let ss = '<span style="color:#8b949e">车端 CPU ' + sysInfo.cpu + '%';
      if (sysInfo.cpu >= 85) ss = '<span style="color:#f85149">车端 CPU ' + sysInfo.cpu + '%';
      else if (sysInfo.cpu >= 60) ss = '<span style="color:#d29922">车端 CPU ' + sysInfo.cpu + '%';
      ss += ' · 内存 ' + sysInfo.mem + '/' + sysInfo.memtot + ' MB</span>';
      t += ' · ' + ss;
    }
    $('cnt').innerHTML = t;
    say('');
  } else {
    $('cnt').textContent = '等待出图…';
  }
  const vis = $('grid').children.length;
  $('empty').style.display = vis ? 'none' : '';
  if (!vis && !sessions.size) $('empty').textContent = '勾选相机 → 点「连接」';
}

async function stopAll(clear){
  stopping = true;
  clearInterval(timer);
  if (sessions.size) {
    uiLog('点击断开 -> 共 ' + sessions.size + ' 路: '
          + Array.from(sessions.keys()).join(', '));
  }
  // 关键：不 await 这些请求。
  // 会话超时时 SSH 通道半死，/api/disconnect 可能挂很久甚至不返回。
  // 原来用 Promise.all 等待，结果就是"点了断开没反应"。
  // 现在发出去就不管了，本地状态立刻清理 —— 用户点击必须马上看到反馈。
  sessions.forEach(s => {
    if (!s.sid) return;
    Promise.race([
      jpost('/api/disconnect', {sid:s.sid}),
      new Promise(r => setTimeout(r, 2000))   // 兜底，2 秒后放弃等待
    ]).catch(() => {});
  });
  sessions.clear();
  $('grid').innerHTML = '';
  CAMS.forEach(c => setTag(c.key, '', ''));
  $('dot').classList.remove('on'); $('st').textContent = '未连接'; $('cnt').textContent = '';
  curHostText = '';
  $('go').disabled = false; $('go').classList.remove('busy'); $('go').textContent = '▶ 连接';
  $('stop').disabled = true; $('stop').classList.remove('armed'); $('stop').textContent = '⏹ 断开';
  $('empty').style.display = ''; $('empty').textContent = '勾选相机 → 点「连接」';
  if (clear !== false) say('已断开', 'ok');
  // 断开后冷却 5 秒。
  // 服务端的 kill 车端进程 / 关 SSH 是异步的，可能要几秒才真正结束。
  // 这期间再点连接，新脚本会和还没死透的旧进程抢资源，
  // 表现就是"连接中"一直卡住。所以按钮先禁用并倒数。
  startCooldown(5);
  setTimeout(() => { stopping = false; }, 300);
}
$('stop').onclick = () => stopAll(true);

// ── 断开后的冷却倒计时 ──
let cdTimer = null;
function startCooldown(sec){
  clearInterval(cdTimer);
  let left = sec;
  $('go').disabled = true;
  $('go').textContent = '请等 ' + left + 's';
  cdTimer = setInterval(() => {
    left--;
    if (left > 0) {
      $('go').textContent = '请等 ' + left + 's';
      return;
    }
    clearInterval(cdTimer); cdTimer = null;
    $('go').disabled = false;
    $('go').textContent = '▶ 连接';
  }, 1000);
}
// Esc 快捷断开：连接态下按一下就断，比找按钮快
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sessions.size) stopAll(true);
});

/* ── 日志面板（替代黑窗口） ── */
const logBody = () => $('logbody');
function addLog(txt){
  const b = logBody(); if (!b) return;
  const d = document.createElement('div');
  const isCar = txt.includes('[车]');
  const isErr = /错误|失败|异常|error|Error|Traceback/.test(txt);
  d.textContent = txt.replace(/^\[srv\]\s*/, '').replace(/^\[车\]\s*/, '[车] ');
  d.className = isErr ? 'e' : (isCar ? 'c' : '');
  b.appendChild(d);
  while (b.children.length > 300) b.removeChild(b.firstChild);
  b.scrollTop = b.scrollHeight;
}
$('logclr').onclick = () => { logBody().innerHTML = ''; };
// 日志用轮询，不用 SSE。
//
// 原因：浏览器对同一 host 的并发连接数上限是 6（HTTP/1.1）。
// 5 路相机就是 5 个 MJPEG 长连接，再加 1 个 SSE 长连接正好占满，
// 剩下的视频流和状态轮询全排不上队 —— 表现为"日志有数据、画面只出来一路"。
// 短连接轮询用完即释放，把长连接名额全留给视频流。
let logSeq = 0;
async function pumpLog(){
  try{
    const r = await fetch('/api/logs?since=' + logSeq, {cache:'no-store'});
    const j = await r.json();
    if (j.ok && j.lines && j.lines.length){
      j.lines.forEach(addLog);
    }
    if (j.ok) logSeq = j.seq || 0;
  }catch(e){ /* 拿不到就算了 */ }
}
pumpLog();
setInterval(pumpLog, 1200);

// 关页面时通知服务端一起退出，省得黑窗口留在后台占端口。
// 下次启动若端口被旧进程占着，新的可能连不上（v1.6 之前踩过）。
// 用 navigator.sendBeacon：页面卸载时 fetch 可能发不出去，beacon 不会。
window.addEventListener('beforeunload', () => {
  try {
    navigator.sendBeacon('/api/quit', new Blob(['{}'], {type:'application/json'}));
  } catch(e){}
});

// 前端本地也打一条，方便对照"我点了什么 / 服务端收到什么"
function uiLog(t){ addLog('[ui] ' + t); }

window.addEventListener('resize', () => {
  sessions.forEach((s, k) => {
    if (s.cv && !s.cvFail) return;   // canvas 靠 CSS max-width/height 自适应
    const img = s.view && s.view.querySelector('img');
    if (img) fit(img, s.rot);
  });
});


const PAGE_VER = '2.10';
async function checkVersion(){
  try{
    const r = await fetch('/api/version', {cache:'no-store'});
    const j = await r.json();
    if (!j.ok) return;
    const el = $('svver');
    if (!el) return;
    if (String(j.version) === PAGE_VER){
      el.textContent = '服务 v' + j.version;
      el.style.color = '#3fb950';
    } else {
      el.textContent = '服务 v' + j.version + ' (页面 v' + PAGE_VER + ')';
      el.style.color = '#f85149';
      const w = document.createElement('div');
      w.className = 'verwarn';
      w.innerHTML = '<b>版本不一致：正在使用旧服务进程 v' + j.version
        + '，本页是 v' + PAGE_VER + '。</b><br>'
        + '原因：之前启动的黑窗口没关，仍占用 8765 端口，新代码没生效。<br>'
        + '<b>请关闭所有 python 黑窗口</b>（或任务管理器结束 python.exe），'
        + '再重新双击 start.bat。<br>'
        + '当前服务启动于 ' + (j.started||'?') + '，PID ' + (j.pid||'?') + '。';
      const box = $('msg');
      if (box && box.parentNode) box.parentNode.insertBefore(w, box);
    }
  }catch(e){}
}

buildCamList();
checkVersion();
checkGate();
$('gok').addEventListener('click', gateLogin);
$('gp').addEventListener('keydown', e => { if (e.key === 'Enter') gateLogin(); });
$('gu').addEventListener('keydown', e => { if (e.key === 'Enter') $('gp').focus(); });
$('caps').textContent = (async()=>{
  const c = await (await fetch('/api/caps')).json();
  return ['PIL:'+(c.pil?'有':'无'), 'paramiko:'+(c.paramiko?'有':'无'), c.mock?'MOCK模式':''].filter(Boolean).join(' · ');
})();
