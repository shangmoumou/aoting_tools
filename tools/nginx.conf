# 调试工具箱 —— Nginx 配置片段
#
# 放到 /etc/nginx/conf.d/tools.conf（或 sites-available 下做软链），
# 然后 nginx -t && systemctl reload nginx

server {
    listen 80;

    # 公司内网用 IP 访问，不需要域名，也不需要备案。
    # server_name _; 匹配任意主机名/IP。
    server_name _;

    # ── 关于 https（重要）────────────────────────────────
    # Service Worker 只在 https 或 localhost 下能注册。
    # 用 http://192.168.x.x 访问时 SW 注册失败，结果是：
    #     能用的：三个工具、版本更新提示
    #     不能用的：离线访问
    # 门户已做降级（改用 localStorage 记录版本），所以内网 http 下
    # 更新提示仍然工作，只是不能离线。
    #
    # 如果需要离线能力，让 IT 用内部 CA 签一张内网 IP 证书，改成：
    #     listen 443 ssl;
    #     ssl_certificate     /path/to/cert.pem;
    #     ssl_certificate_key /path/to/key.pem;
    #
    # 另：门户探测 http://127.0.0.1:8765 时，https 页面请求 127.0.0.1
    # 不会被当混合内容拦掉（127.0.0.1 属于可信来源），跨域由 server.py
    # 的 CORS 头处理，已内置。

    root /var/www/tools;      # ← 放 portal 目录内容的地方（不含 portal 这一层）
    index index.html;

    # ── 缓存策略：这是最容易踩坑的地方 ──
    #
    # version.json 和 sw.js 必须 no-cache。
    # 它们被缓存住的话，用户永远发现不了新版本（见过太多这类事故）。
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # HTML 也禁缓存：Service Worker 自己会做缓存，
    # 再叠一层 HTTP 缓存会让"到底是哪一版"变得难以判断。
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 其余静态资源（将来拆出 css/js 时用）可以长缓存
    location ~* \.(js|css|png|jpg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # 下载区：让浏览器直接下载而不是当成文本显示
    location /dl/ {
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
    }

    # 别让搜索引擎收录内部工具
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;
}
